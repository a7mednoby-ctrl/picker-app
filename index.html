<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بيانات الشكاوى</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Tahoma,sans-serif;
}

body{
    background:#f4f6f9;
    padding:20px;
}

.container{
    max-width:1200px;
    margin:auto;
}

h1{
    text-align:center;
    margin-bottom:20px;
    color:#333;
}

.card{
    background:white;
    border-radius:12px;
    padding:15px;
    margin-bottom:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.loading{
    text-align:center;
    font-size:18px;
    color:#666;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    border-radius:12px;
    overflow:hidden;
}

th{
    background:#1976d2;
    color:white;
    padding:12px;
}

td{
    padding:10px;
    border-bottom:1px solid #eee;
}

tr:hover{
    background:#f8f9fa;
}

.search-box{
    margin-bottom:15px;
}

.search-box input{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:15px;
}
</style>
</head>
<body>

<div class="container">

<h1>لوحة الشكاوى</h1>

<div class="search-box">
    <input type="text" id="search" placeholder="ابحث...">
</div>

<div id="loading" class="loading">
    جاري تحميل البيانات...
</div>

<table id="table" style="display:none;">
    <thead id="thead"></thead>
    <tbody id="tbody"></tbody>
</table>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbyQyw1uN7KZQ8L8BfQmdE450CpcypLfidBXFHmLKeensCaPlhhZtud7V8c4zItiQiw_YA/exec";

let originalData = [];

async function loadData(){

    try{

        const response = await fetch(API_URL);
        const data = await response.json();

        originalData = data;

        if(!data.length){
            document.getElementById("loading").innerHTML =
            "لا توجد بيانات";
            return;
        }

        renderTable(data);

        document.getElementById("loading").style.display="none";
        document.getElementById("table").style.display="table";

    }catch(error){

        document.getElementById("loading").innerHTML =
        "حدث خطأ أثناء تحميل البيانات";

        console.error(error);
    }
}

function renderTable(data){

    const headers = Object.keys(data[0]);

    document.getElementById("thead").innerHTML =
        `<tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr>`;

    document.getElementById("tbody").innerHTML =
        data.map(row=>`
            <tr>
                ${headers.map(h=>`<td>${row[h] ?? ""}</td>`).join("")}
            </tr>
        `).join("");
}

document.getElementById("search")
.addEventListener("input",function(){

    const keyword = this.value.toLowerCase();

    const filtered = originalData.filter(row =>
        Object.values(row).some(value =>
            String(value).toLowerCase().includes(keyword)
        )
    );

    renderTable(filtered.length ? filtered : originalData);
});

loadData();

</script>

</body>
</html>
